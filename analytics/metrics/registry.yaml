# =============================================================================
# Semantic metric registry — the only naming authority for metric populations
# over the canonical dbt warehouse.
#
# Ported from the cohortc pattern (architecture review [Data] P1): every metric
# is named exactly once, qualified by source system (`metric@source_system` —
# the source side matches the connector erp_id stamp), bound to a dbt model +
# expression, and carries a MEASURED population size. Resolution refuses
# unknown names and ambiguous bare names — it never guesses
# (analytics/metrics/registry.py).
#
# dbt stays the single source of truth: entries may only bind to modeled dbt
# models and reference columns the dbt manifest declares. Mart-bound entries
# reference the dbt column bare; the registry never restates mart math.
#
# After any dbt data or model change, re-measure and update `measured`:
#   make metrics-check
# =============================================================================
schema_version: 1
metrics:
  # ---- Population metrics (canonical fact grain; the count IS the metric) ----
  - name: open_po@csv_sftp
    description: >-
      Open purchase-order lines for the csv_sftp dealer feed — lines ordered
      but not yet fully received (received_qty below ordered_qty).
    dbt_model: fact_purchase_order_line
    expression: count(*) filter (where not is_received_in_full)
    population:
      count_sql: |
        select count(*) from main_canonical.fact_purchase_order_line
        where source_system = 'csv_sftp' and not is_received_in_full
      measured: 69

  # ---- Value metrics (kpi_headline grain; dbt computes, the registry references) ----
  - name: gmroi@csv_sftp
    description: >-
      GMROI — gross margin return on inventory investment — annualized on the
      analysis window (computed by dbt in kpi_inventory).
    dbt_model: kpi_headline
    expression: gmroi
    population:
      count_sql: select count(*) from main_marts.kpi_headline
      measured: 1
  - name: inventory_turns@csv_sftp
