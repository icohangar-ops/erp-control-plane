# dbt-duckdb profile. The analytics database is the per-customer DuckDB file
# written by ingestion; paths resolve from the repo root (make targets run there).
bmd_analytics:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('ANALYTICS_DUCKDB_PATH', './data/analytics/analytics.duckdb') }}"
      threads: 4
