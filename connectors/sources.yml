# Source registry — every connector the control plane knows about.
#
# Settings values support env-var interpolation: ${VAR} or ${VAR:-default}
# (resolved at load time; secrets stay in the environment, never in this file).
# `enabled: false` sources are registered templates: importable, plannable via
# dry-run, and excluded from extraction until per-tenant discovery completes.

version: 1

sources:
  # ------------------------------------------------------------------
  # Demo tenant: Ridgeline Lumber & Supply (fictional acquired dealer).
  # Fully working csv_sftp path over the seeded export in demo/dealer_export.
  # ------------------------------------------------------------------
  - source_id: csvsftp_ridgeline
    erp: csv_sftp
    description: >
      Ridgeline Lumber & Supply — seeded demo dealer. Nightly SFTP drop of
      CSV exports with a manifest control file (simulated locally).
    enabled: true
    settings:
      drop_root: ${CSV_SFTP_DROP_ROOT:-seed/dealer_export}
      allow_additive_columns: "true"

  # ------------------------------------------------------------------
  # Credential-gated first-wave adapters. Coded to the documented extraction
  # surface but NOT exercised against a live tenant. Enable only after
  # sandbox-tenant discovery per docs/CONNECTOR_GUIDE.md.
  # ------------------------------------------------------------------
  - source_id: netsuite_template
    erp: netsuite
    description: >
      NetSuite (SuiteQL / SuiteAnalytics workbook) adapter — coded against the
      documented REST API but UNEXERCISED pending tenant credentials.
    enabled: false
    settings:
      account_id: ${NETSUITE_ACCOUNT_ID:-}
      consumer_key: ${NETSUITE_CONSUMER_KEY:-}
      consumer_secret: ${NETSUITE_CONSUMER_SECRET:-}
      token_id: ${NETSUITE_TOKEN_ID:-}
      token_secret: ${NETSUITE_TOKEN_SECRET:-}
      realm: ${NETSUITE_REALM:-}
      api_version: ${NETSUITE_API_VERSION:-2024_1}

  # ------------------------------------------------------------------
  # Documented skeletons — extraction surface noted, implementation deferred
  # to per-acquisition discovery. Each still exposes entities(), a plan, and
  # a dry-run; extract() raises ConnectorNotImplemented.
  # ------------------------------------------------------------------
  - source_id: bistrack_template
    erp: bistrack
    description: >
      BisTrack (Epicor) — read-only ODBC to the on-prem SQL DB, or BisTrack
      Web Smart View API where deployed.
    enabled: false
    settings:
      mode: ${BISTRACK_MODE:-odbc}
      odbc_dsn: ${BISTRACK_ODBC_DSN:-}
      db_user: ${BISTRACK_DB_USER:-}
      db_password: ${BISTRACK_DB_PASSWORD:-}
      smartview_base_url: ${BISTRACK_SMARTVIEW_URL:-}
      smartview_api_key: ${BISTRACK_SMARTVIEW_KEY:-}

  - source_id: dmsi_agility_template
    erp: dmsi_agility
    description: >
      DMSi Agility — REST API extraction; skeleton pending tenant sandbox
      access and endpoint inventory.
    enabled: false
    settings:
      base_url: ${DMSI_BASE_URL:-}
      client_id: ${DMSI_CLIENT_ID:-}
      client_secret: ${DMSI_CLIENT_SECRET:-}

  - source_id: epicor_p21_template
    erp: epicor_p21
    description: >
      Epicor Prophet 21 — OData v4 Data Services (cloud) with explicit $top
      paging and watermark on date_last_modified. Coded to the documented
      surface; UNEXERCISED pending tenant $metadata validation. On-prem sites
      should use the SQL Server connector against a read-only replica.
    enabled: false
    settings:
      mode: ${P21_MODE:-sql}
      sql_dsn: ${P21_SQL_DSN:-}
      odata_base_url: ${P21_ODATA_URL:-}
      odata_user: ${P21_ODATA_USER:-}
      odata_password: ${P21_ODATA_PASSWORD:-}

  - source_id: epicor_eclipse_template
    erp: epicor_eclipse
    description: >
      Epicor Eclipse — REST-only API over InterSystems Caché; skeleton pending
      API user provisioning on the tenant.
    enabled: false
    settings:
      base_url: ${ECLIPSE_BASE_URL:-}
      username: ${ECLIPSE_USERNAME:-}
      password: ${ECLIPSE_PASSWORD:-}

  - source_id: eci_spruce_template
    erp: eci_spruce
    description: >
      ECI Spruce / RockSolid MAX — SOAP web services (RockSolid) or CSV export
      fallback (Spruce); skeleton pending vendor account and WSDL review.
    enabled: false
    settings:
      product: ${ECI_PRODUCT:-spruce}
      wsdl_url: ${ECI_WSDL_URL:-}
      username: ${ECI_USERNAME:-}
      password: ${ECI_PASSWORD:-}
      csv_drop_root: ${ECI_CSV_DROP_ROOT:-}

  - source_id: d365_bc_template
    erp: d365_bc
    description: >
      Dynamics 365 Business Central — API v2.0/OData v4 with $top + continuation
      paging, Data-Access-Intent: ReadOnly, and HTTP 429 backoff. Coded to the
      documented surface; UNEXERCISED pending Entra app registration.
    enabled: false
    settings:
      tenant_id: ${D365BC_TENANT_ID:-}
      client_id: ${D365BC_CLIENT_ID:-}
      client_secret: ${D365BC_CLIENT_SECRET:-}
      environment: ${D365BC_ENVIRONMENT:-}
      company_id: ${D365BC_COMPANY_ID:-}
      api_version: ${D365BC_API_VERSION:-v2.0}

  # ------------------------------------------------------------------
  # Legacy database connector pack (spec §5 rows 1–9). Every class shares the
  # DB-API batch extraction path with anti-join delete reconciliation; CDC is
  # documented per connector (connectors/legacy/*/cdc.py) but not CI-required.
  # Fixture-tested in CI; enable per site after driver/credential discovery.
  # ------------------------------------------------------------------
  - source_id: informix_template
    erp: informix
    description: >
      IBM Informix — ODBC batch via watermark (Informix Client SDK driver);
      optional Debezium change-streams CDC module documented, not CI-required.
    enabled: false
    settings:
      odbc_dsn: ${INFORMIX_ODBC_DSN:-}
      db_user: ${INFORMIX_DB_USER:-}
      db_password: ${INFORMIX_DB_PASSWORD:-}

  - source_id: db2_luw_template
    erp: db2_luw
    description: >
      IBM Db2 LUW — ODBC batch via watermark (Db2 ODBC/CLI driver). CDC is
      gated on the IIDR license (inventory C1) — batch needs no license.
    enabled: false
    settings:
      odbc_dsn: ${DB2_LUW_ODBC_DSN:-}
      db_user: ${DB2_LUW_DB_USER:-}
      db_password: ${DB2_LUW_DB_PASSWORD:-}

  - source_id: db2_iseries_template
    erp: db2_iseries
    description: >
      Db2 for i — JT400 JDBC batch via the JayDeBeApi bridge (default path;
      inventory C3). Debezium connector is incubating: any attempt must pin a
      Final artifact.
    enabled: false
    settings:
      jdbc_url: ${DB2I_JDBC_URL:-}
      db_user: ${DB2I_DB_USER:-}
      db_password: ${DB2I_DB_PASSWORD:-}
      jt400_jars: ${DB2I_JT400_JARS:-}

  - source_id: oracle_template
    erp: oracle
    description: >
      Oracle — ODBC batch via watermark (Oracle ODBC driver). LogMiner CDC
      needs no extra license; XStream requires GoldenGate (see cdc module).
    enabled: false
    settings:
      odbc_dsn: ${ORACLE_ODBC_DSN:-}
      db_user: ${ORACLE_DB_USER:-}
      db_password: ${ORACLE_DB_PASSWORD:-}

  - source_id: sqlserver_template
    erp: sqlserver
    description: >
      SQL Server — native CDC change tables plus ODBC batch (MS ODBC Driver
      18); batch with the anti-join is the CI-tested default.
    enabled: false
    settings:
      odbc_dsn: ${SQLSERVER_ODBC_DSN:-}
      db_user: ${SQLSERVER_DB_USER:-}
      db_password: ${SQLSERVER_DB_PASSWORD:-}

  - source_id: postgresql_template
    erp: postgresql
    description: >
      PostgreSQL — DB-API (psycopg2) batch via watermark; Debezium logical
      decoding (pgoutput, UTF-8) documented in the cdc module.
    enabled: false
    settings:
      db_host: ${PG_DB_HOST:-}
      db_port: ${PG_DB_PORT:-5432}
      db_name: ${PG_DB_NAME:-}
      db_user: ${PG_DB_USER:-}
      db_password: ${PG_DB_PASSWORD:-}

  - source_id: mysql_template
    erp: mysql
    description: >
      MySQL — DB-API (PyMySQL) batch via watermark; stable Debezium binlog
      connector documented. Connector/J GPLv2/UFE license note (inventory C5).
    enabled: false
    settings:
      db_host: ${MYSQL_DB_HOST:-}
      db_port: ${MYSQL_DB_PORT:-3306}
      db_name: ${MYSQL_DB_NAME:-}
      db_user: ${MYSQL_DB_USER:-}
      db_password: ${MYSQL_DB_PASSWORD:-}

  - source_id: mariadb_template
    erp: mariadb
    description: >
      MariaDB — same pack as MySQL (non-incubating Debezium connector per C5);
      no Connector/J license note applies to the PyMySQL batch path.
    enabled: false
    settings:
      db_host: ${MARIADB_DB_HOST:-}
      db_port: ${MARIADB_DB_PORT:-3306}
      db_name: ${MARIADB_DB_NAME:-}
      db_user: ${MARIADB_DB_USER:-}
      db_password: ${MARIADB_DB_PASSWORD:-}

  - source_id: sybase_ase_template
    erp: sybase_ase
    description: >
      SAP Sybase ASE — jConnect JDBC batch only (no Debezium connector exists;
      inventory C7). Set soft_delete_column/soft_delete_value when deletes are
      soft-flagged; hard deletes reconcile via the anti-join.
    enabled: false
    settings:
      jdbc_url: ${SYBASE_JDBC_URL:-}
      db_user: ${SYBASE_DB_USER:-}
      db_password: ${SYBASE_DB_PASSWORD:-}
      jconnect_jars: ${SYBASE_JCONNECT_JARS:-}
      soft_delete_column: ${SYBASE_SOFT_DELETE_COLUMN:-}
      soft_delete_value: ${SYBASE_SOFT_DELETE_VALUE:-}

  - source_id: openedge_template
    erp: openedge
    description: >
      Progress OpenEdge — custom pyodbc/DataDirect ODBC dlt resource (no
      SQLAlchemy dialect exists, inventory C2). Batch only; native OpenEdge
      CDC / Pro2 is the site-licensed pilot option.
    enabled: false
    settings:
      odbc_dsn: ${OPENEDGE_ODBC_DSN:-}
      db_user: ${OPENEDGE_DB_USER:-}
      db_password: ${OPENEDGE_DB_PASSWORD:-}
