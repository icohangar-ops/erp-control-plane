# Source registry — every connector the control plane knows about.
#
# Settings values support env-var interpolation: ${VAR} or ${VAR:-default}
# (resolved at load time; secrets stay in the environment, never in this file).
# `enabled: false` sources are registered templates: importable, plannable via
# dry-run, and excluded from extraction until per-tenant discovery completes.

version: 1

sources:
  # ------------------------------------------------------------------
  # Demo tenant: Ridgeline Lumber & Supply (fictional acquired dealer).
  # Fully working csv_sftp path over the seeded export in demo/dealer_export.
  # ------------------------------------------------------------------
  - source_id: csvsftp_ridgeline
    erp: csv_sftp
    description: >
      Ridgeline Lumber & Supply — seeded demo dealer. Nightly SFTP drop of
      CSV exports with a manifest control file (simulated locally).
    enabled: true
    settings:
      drop_root: ${CSV_SFTP_DROP_ROOT:-seed/dealer_export}
      allow_additive_columns: "true"

  # ------------------------------------------------------------------
  # Demo Informix tenant: the SAME seeded Ridgeline export standing in for
  # the dealer's Informix ERP, loaded through the legacy connector pack
  # (spec §5 row 1). demo/run_informix_demo.py builds the stand-in database
  # (ifx_* tables) and drives InformixConnector over a DB-API connection
  # factory — the real watermark/provenance/anti-join machinery; only the
  # pyodbc transport is stood in. Ships disabled (like every demo-adjacent
  # source; the demo runner enables it in memory so `make demo` and CI keep
  # csvsftp_ridgeline as the only enabled source).
  # ------------------------------------------------------------------
  - source_id: informix_demo
    erp: informix
    description: >
      Ridgeline Lumber & Supply — demo Informix surface (seed dealer export
      loaded into a stand-in Informix-shaped database). Demonstrates the
      legacy SQL connector pack end to end per the GenBI spec §5 row 1.
      Per-flavor coverage: ODBC batch primary for standalone 14.10/15.0 (and
      the container flavor pending image discovery [D-7]); JDBC variant
      planned for CP4D/Software Hub, gated on discovery [D-1]; CDC
      documented-not-required (Debezium Informix "incubating" — externally
      corroborated). Coded path is standalone ODBC only — never exercised
      against a live tenant; discovery checklist: docs/CONNECTOR_GUIDE.md.
    enabled: false
    settings:
      odbc_dsn: "ifx_demo_standin"
      db_user: "demo"
      db_password: "demo"

  # ------------------------------------------------------------------
  # Credential-gated first-wave adapters. Coded to the documented extraction
  # surface but NOT exercised against a live tenant. Enable only after
  # sandbox-tenant discovery per docs/CONNECTOR_GUIDE.md.
  # ------------------------------------------------------------------
  - source_id: netsuite_template
    erp: netsuite
    description: >
      NetSuite (SuiteQL / SuiteAnalytics workbook) adapter — coded against the
      documented REST API but UNEXERCISED pending tenant credentials.
    enabled: false
    settings:
      account_id: ${NETSUITE_ACCOUNT_ID:-}
      consumer_key: ${NETSUITE_CONSUMER_KEY:-}
      consumer_secret: ${NETSUITE_CONSUMER_SECRET:-}
      token_id: ${NETSUITE_TOKEN_ID:-}
      token_secret: ${NETSUITE_TOKEN_SECRET:-}
      realm: ${NETSUITE_REALM:-}
      subsidiaries: ${NETSUITE_SUBSIDIARIES:-}
      accounting_book_id: ${NETSUITE_ACCOUNTING_BOOK_ID:-}

  # ------------------------------------------------------------------
  # Documented skeletons — extraction surface noted, implementation deferred
  # to per-acquisition discovery. Each still exposes entities(), a plan, and
  # a dry-run; extract() raises ConnectorNotImplemented.
  # ------------------------------------------------------------------
  - source_id: bistrack_template
    erp: bistrack
    description: >
      BisTrack (Epicor) — read-only ODBC to the on-prem SQL DB, or BisTrack
      Web Smart View API where deployed.
    enabled: false
    settings:
      mode: ${BISTRACK_MODE:-odbc}
      odbc_dsn: ${BISTRACK_ODBC_DSN:-}
      db_user: ${BISTRACK_DB_USER:-}
      db_password: ${BISTRACK_DB_PASSWORD:-}
      order_document_types: ${BISTRACK_ORDER_DOC_TYPES:-}
      invoice_document_types: ${BISTRACK_INVOICE_DOC_TYPES:-}
      smartview_base_url: ${BISTRACK_SMARTVIEW_URL:-}
      smartview_api_key: ${BISTRACK_SMARTVIEW_KEY:-}

  - source_id: dmsi_agility_template
    erp: dmsi_agility
    description: >
      DMSi Agility — AgilityPublic REST extraction: Session/Login context
      (ContextId/Branch headers), chunk-pointer paging, customer-scoped orders
      and invoices, dated inventory snapshots; GL and PO lists stay documented
      hybrid-channel plans (spec art_4U49qR1B).
    enabled: false
    settings:
      api_url: ${DMSI_API_URL:-}
      login_id: ${DMSI_LOGIN_ID:-}
      password: ${DMSI_PASSWORD:-}
      customers: ${DMSI_CUSTOMERS:-}
      go_live_date: ${DMSI_GO_LIVE_DATE:-}
      record_fetch_limit: ${DMSI_RECORD_FETCH_LIMIT:-500}
      invoice_window_days: ${DMSI_INVOICE_WINDOW_DAYS:-14}

  - source_id: epicor_p21_template
    erp: epicor_p21
    description: >
      Epicor Prophet 21 — OData v4 Data Services (cloud) with middleware token
      auth (/api/security/token/v2), soft-delete-flag filtering, and
      deterministic $orderby/$top/$skip paging. Coded to the documented
      surface; UNEXERCISED pending tenant $metadata validation. On-prem sites
      should use the SQL Server connector against a read-only replica.
    enabled: false
    settings:
      odata_base_url: ${P21_ODATA_URL:-}
      odata_user: ${P21_ODATA_USER:-}
      odata_password: ${P21_ODATA_PASSWORD:-}
      as_of_date: ${P21_AS_OF_DATE:-}

  - source_id: epicor_eclipse_template
    erp: epicor_eclipse
    description: >
      Epicor Eclipse — REST-only API over InterSystems Caché: session-token
      auth (POST /Sessions mints sessionToken + refreshToken;
      /SessionRefresh recovers an expired-but-not-deleted session — the
      sessionToken rides the tenant-pinned token header), query-param paging,
      updatedAfter watermarks, dated inventory sweeps, GL via
      GLInquiryDetail. Coded to the documented surface (spec art_Hp74a48b);
      UNEXERCISED pending tenant API-doc discovery. The session/paging wire
      contract is per-tenant ([D] — fail-closed REQUIRED settings below); no
      /Invoices endpoint exists, so invoice lines stay a documented
      hybrid-channel plan.
    enabled: false
    settings:
      base_url: ${ECLIPSE_BASE_URL:-}
      username: ${ECLIPSE_USERNAME:-}
      password: ${ECLIPSE_PASSWORD:-}
      session_user_field: ${ECLIPSE_SESSION_USER_FIELD:-}
      session_password_field: ${ECLIPSE_SESSION_PASSWORD_FIELD:-}
      token_header: ${ECLIPSE_TOKEN_HEADER:-}
      watermark_field: ${ECLIPSE_WATERMARK_FIELD:-}
      page_size_param: ${ECLIPSE_PAGE_SIZE_PARAM:-}
      page_number_param: ${ECLIPSE_PAGE_NUMBER_PARAM:-}
      page_number_start: ${ECLIPSE_PAGE_NUMBER_START:-}
      page_size: ${ECLIPSE_PAGE_SIZE:-}
      go_live_date: ${ECLIPSE_GO_LIVE_DATE:-}

  - source_id: eci_spruce_template
    erp: eci_spruce
    description: >
      ECI Spruce / RockSolid MAX — dealer-mediated file drop: scheduled-report /
      cloud-folder exports (CSV or RSM pipe layout) with a manifest control
      file (checksums, row counts, generation stamps). Coded to the documented
      file surfaces; UNEXERCISED pending dealer onboarding. The SOAP Ecommerce
      API stays NDA-gated future work (spec art_ktSh9Z8x §2/§8). Product,
      hosting, and layout pin at onboarding ([D] — fail-closed REQUIRED
      settings below).
    enabled: false
    settings:
      product: ${ECI_PRODUCT:-}
      hosting: ${ECI_HOSTING:-}
      layout_profile: ${ECI_LAYOUT_PROFILE:-}
      csv_drop_root: ${ECI_CSV_DROP_ROOT:-}
      allow_additive_columns: "true"
      quarantine_dir: ${ECI_QUARANTINE_DIR:-}

  - source_id: d365_bc_template
    erp: d365_bc
    description: >
      Dynamics 365 Business Central — API v2.0/OData v4 with per-company
      iteration over D365BC_COMPANIES (comma-separated company ids), $top +
      continuation paging, Data-Access-Intent: ReadOnly, and HTTP 429/503/504
      backoff. The checkpoint is the max lastModifiedDateTime observed across
      ALL configured companies. Coded to the documented surface; UNEXERCISED
      pending Entra app registration.
    enabled: false
    settings:
      tenant_id: ${D365BC_TENANT_ID:-}
      client_id: ${D365BC_CLIENT_ID:-}
      client_secret: ${D365BC_CLIENT_SECRET:-}
      environment: ${D365BC_ENVIRONMENT:-}
      companies: ${D365BC_COMPANIES:-}
      api_version: ${D365BC_API_VERSION:-v2.0}

  - source_id: cloud_erp_rest_template
    erp: cloud_erp_rest
    description: >
      Cloud ERP REST (Plex / Dynamics 365) — per-tenant profiles over the dlt
      rest_api verified-source approach: API-key or OAuth2 client-credentials
      auth, explicit pagination (Plex page/pageSize, OData @odata.nextLink),
      and modified-timestamp watermarks. No delete feeds on these APIs —
      the scheduled full-key anti-join reconciles deletes. Resource paths and
      field maps validate against tenant API metadata at onboarding.
    enabled: false
    settings:
      provider: ${CLOUD_ERP_PROVIDER:-}
      base_url: ${CLOUD_ERP_BASE_URL:-}
      auth_mode: ${CLOUD_ERP_AUTH_MODE:-}
      api_key: ${CLOUD_ERP_API_KEY:-}
      api_key_header: ${CLOUD_ERP_API_KEY_HEADER:-}
      token_url: ${CLOUD_ERP_TOKEN_URL:-}
      scope: ${CLOUD_ERP_OAUTH_SCOPE:-}
      client_id: ${CLOUD_ERP_CLIENT_ID:-}
      client_secret: ${CLOUD_ERP_CLIENT_SECRET:-}
      tenant_id: ${CLOUD_ERP_AAD_TENANT_ID:-}
      watermark_field: ${CLOUD_ERP_WATERMARK_FIELD:-}
      incremental_query: ${CLOUD_ERP_INCREMENTAL_QUERY:-}
      page_size: ${CLOUD_ERP_PAGE_SIZE:-}

  - source_id: essbase_template
    erp: essbase
    description: >
      Oracle Essbase REST v1 metadata connector — full snapshots of applications
      and cubes (application databases), using documented offset/limit paging.
      Data export jobs and Outbox ZIP downloads remain a separate onboarding
      surface; enable only after validating the tenant REST base path and auth.
    enabled: false
    settings:
      base_url: ${ESSBASE_BASE_URL:-}
      auth_mode: ${ESSBASE_AUTH_MODE:-basic}
      username: ${ESSBASE_USERNAME:-}
      password: ${ESSBASE_PASSWORD:-}
      token: ${ESSBASE_TOKEN:-}

  # ------------------------------------------------------------------
  # Legacy database connector pack (spec §5 rows 1–9). Every class shares the
  # DB-API batch extraction path with anti-join delete reconciliation; CDC is
  # documented per connector (connectors/legacy/*/cdc.py) but not CI-required.
  # Fixture-tested in CI; enable per site after driver/credential discovery.
  # ------------------------------------------------------------------
  - source_id: informix_template
    erp: informix
    description: >
      IBM Informix — ODBC batch via watermark (Informix Client SDK driver).
      Per-flavor coverage: ODBC batch primary for standalone 14.10/15.0 (and
      the container flavor pending image discovery [D-7]); JDBC variant
      planned for CP4D/Software Hub, gated on discovery [D-1]; CDC
      documented-not-required (Debezium Informix "incubating" — externally
      corroborated). Coded path is standalone ODBC only — never exercised
      against a live tenant; discovery checklist: docs/CONNECTOR_GUIDE.md.
    enabled: false
    settings:
      odbc_dsn: ${INFORMIX_ODBC_DSN:-}
      db_user: ${INFORMIX_DB_USER:-}
      db_password: ${INFORMIX_DB_PASSWORD:-}

  - source_id: db2_luw_template
    erp: db2_luw
    description: >
      IBM Db2 LUW — ODBC batch via watermark (Db2 ODBC/CLI driver). CDC is
      gated on the IIDR license (inventory C1) — batch needs no license.
    enabled: false
    settings:
      odbc_dsn: ${DB2_LUW_ODBC_DSN:-}
      db_user: ${DB2_LUW_DB_USER:-}
      db_password: ${DB2_LUW_DB_PASSWORD:-}

  - source_id: db2_iseries_template
    erp: db2_iseries
    description: >
      Db2 for i — JT400 JDBC batch via the JayDeBeApi bridge (default path;
      inventory C3). Debezium connector is incubating: any attempt must pin a
      Final artifact.
    enabled: false
    settings:
      jdbc_url: ${DB2I_JDBC_URL:-}
      db_user: ${DB2I_DB_USER:-}
      db_password: ${DB2I_DB_PASSWORD:-}
      jt400_jars: ${DB2I_JT400_JARS:-}

  - source_id: oracle_template
    erp: oracle
    description: >
      Oracle — ODBC batch via watermark (Oracle ODBC driver). LogMiner CDC
      needs no extra license; XStream requires GoldenGate (see cdc module).
    enabled: false
    settings:
      odbc_dsn: ${ORACLE_ODBC_DSN:-}
      db_user: ${ORACLE_DB_USER:-}
      db_password: ${ORACLE_DB_PASSWORD:-}

  - source_id: sqlserver_template
    erp: sqlserver
    description: >
      SQL Server — native CDC change tables plus ODBC batch (MS ODBC Driver
      18); batch with the anti-join is the CI-tested default.
    enabled: false
    settings:
      odbc_dsn: ${SQLSERVER_ODBC_DSN:-}
      db_user: ${SQLSERVER_DB_USER:-}
      db_password: ${SQLSERVER_DB_PASSWORD:-}

  - source_id: postgresql_template
    erp: postgresql
    description: >
      PostgreSQL — DB-API (psycopg2) batch via watermark; Debezium logical
      decoding (pgoutput, UTF-8) documented in the cdc module.
    enabled: false
    settings:
      db_host: ${PG_DB_HOST:-}
      db_port: ${PG_DB_PORT:-5432}
      db_name: ${PG_DB_NAME:-}
      db_user: ${PG_DB_USER:-}
      db_password: ${PG_DB_PASSWORD:-}

  - source_id: mysql_template
    erp: mysql
    description: >
      MySQL — DB-API (PyMySQL) batch via watermark; stable Debezium binlog
      connector documented. Connector/J GPLv2/UFE license note (inventory C5).
    enabled: false
    settings:
      db_host: ${MYSQL_DB_HOST:-}
      db_port: ${MYSQL_DB_PORT:-3306}
      db_name: ${MYSQL_DB_NAME:-}
      db_user: ${MYSQL_DB_USER:-}
      db_password: ${MYSQL_DB_PASSWORD:-}

  - source_id: mariadb_template
    erp: mariadb
    description: >
      MariaDB — same pack as MySQL (non-incubating Debezium connector per C5);
      no Connector/J license note applies to the PyMySQL batch path.
    enabled: false
    settings:
      db_host: ${MARIADB_DB_HOST:-}
      db_port: ${MARIADB_DB_PORT:-3306}
      db_name: ${MARIADB_DB_NAME:-}
      db_user: ${MARIADB_DB_USER:-}
      db_password: ${MARIADB_DB_PASSWORD:-}

  - source_id: sybase_ase_template
    erp: sybase_ase
    description: >
      SAP Sybase ASE — jConnect JDBC batch only (no Debezium connector exists;
      inventory C7). Set soft_delete_column/soft_delete_value when deletes are
      soft-flagged; hard deletes reconcile via the anti-join.
    enabled: false
    settings:
      jdbc_url: ${SYBASE_JDBC_URL:-}
      db_user: ${SYBASE_DB_USER:-}
      db_password: ${SYBASE_DB_PASSWORD:-}
      jconnect_jars: ${SYBASE_JCONNECT_JARS:-}
      soft_delete_column: ${SYBASE_SOFT_DELETE_COLUMN:-}
      soft_delete_value: ${SYBASE_SOFT_DELETE_VALUE:-}

  - source_id: openedge_template
    erp: openedge
    description: >
      Progress OpenEdge — custom pyodbc/DataDirect ODBC dlt resource (no
      SQLAlchemy dialect exists, inventory C2). Batch only; native OpenEdge
      CDC / Pro2 is the site-licensed pilot option.
    enabled: false
    settings:
      odbc_dsn: ${OPENEDGE_ODBC_DSN:-}
      db_user: ${OPENEDGE_DB_USER:-}
      db_password: ${OPENEDGE_DB_PASSWORD:-}

  - source_id: sap_hana_template
    erp: sap_hana
    description: >
      SAP HANA (SAP Business One on HANA) — SQLAlchemy hana:// engine
      (sqlalchemy-hana dialect, hdbcli client) with dlt sql_database batch
      semantics over DBA-maintained staging views exposed to a read-only
      extraction user. Instance ports follow the 3NN15 convention (instance
      90 -> 39015). Batch-only per spec §6: no CDC path verified; deletes
      reconcile via the scheduled full-key anti-join.
    enabled: false
    settings:
      db_host: ${SAP_HANA_DB_HOST:-}
      db_port: ${SAP_HANA_DB_PORT:-39015}
      db_schema: ${SAP_HANA_DB_SCHEMA:-}
      db_user: ${SAP_HANA_DB_USER:-}
      db_password: ${SAP_HANA_DB_PASSWORD:-}
