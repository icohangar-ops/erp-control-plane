name: fact_inventory_snapshot
table_reference:
  catalog: analytics
  schema: main_canonical
  table: fact_inventory_snapshot
columns:
- name: snapshot_key
  type: VARCHAR
  not_null: true
  properties:
    description: Surrogate snapshot key (item + location + snapshot date).
  is_primary_key: true
- name: source_system
  type: VARCHAR
  properties:
    description: Originating source ERP for this row; acquisitions keep their system of record until re-platformed.
  is_primary_key: false
- name: snapshot_date
  type: DATE
  properties:
    description: Inventory snapshot date (month-end per pipeline design).
  is_primary_key: false
- name: location_key
  type: VARCHAR
  properties:
    description: Foreign key to dim_location.
  is_primary_key: false
- name: item_key
  type: VARCHAR
  properties:
    description: Foreign key to dim_item.
  is_primary_key: false
- name: on_hand_qty
  type: BIGINT
  properties:
    description: On-hand quantity.
  is_primary_key: false
- name: allocated_qty
  type: BIGINT
  properties:
    description: Quantity allocated to open orders.
  is_primary_key: false
- name: on_order_qty
  type: BIGINT
  properties:
    description: Quantity on open purchase orders.
  is_primary_key: false
- name: backorder_qty
  type: BIGINT
  properties:
    description: Quantity on backorder.
  is_primary_key: false
- name: unit_cost
  type: DECIMAL(38,9)
  properties:
    description: Valuation unit cost in USD.
  is_primary_key: false
- name: inventory_value
  type: DECIMAL(38,9)
  properties:
    description: On-hand value in USD (on_hand_qty x unit_cost).
  is_primary_key: false
- name: source_file
  type: VARCHAR
  properties:
    description: Source file this row was extracted from (lineage).
  is_primary_key: false
- name: source_row_no
  type: BIGINT
  properties:
    description: Row number within the source file (lineage).
  is_primary_key: false
- name: batch_id
  type: VARCHAR
  properties:
    description: Identifier of the dlt ingestion batch that loaded this row.
  is_primary_key: false
- name: loaded_at
  type: VARCHAR
  properties:
    description: Timestamp the row was loaded into the canonical layer.
  is_primary_key: false
properties:
  description: One row per item/location/snapshot-date inventory position, month-end per pipeline design.
primary_key: snapshot_key
