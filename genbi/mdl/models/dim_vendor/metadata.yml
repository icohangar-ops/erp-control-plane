name: dim_vendor
table_reference:
  catalog: analytics
  schema: main_canonical
  table: dim_vendor
columns:
- name: vendor_key
  type: VARCHAR
  not_null: true
  properties:
    description: Foreign key to dim_vendor.
  is_primary_key: true
- name: source_vendor_no
  type: VARCHAR
  properties:
    description: Native vendor number in the source ERP; kept for lineage and crosswalk back to the source.
  is_primary_key: false
- name: source_system
  type: VARCHAR
  properties:
    description: Originating source ERP for this row; acquisitions keep their system of record until re-platformed.
  is_primary_key: false
- name: vendor_name
  type: VARCHAR
  properties:
    description: Vendor display name.
  is_primary_key: false
- name: terms
  type: VARCHAR
  properties:
    description: Payment terms code from the source ERP.
  is_primary_key: false
- name: lead_time_days
  type: BIGINT
  properties:
    description: Average negotiated lead time in days.
  is_primary_key: false
- name: loaded_at
  type: VARCHAR
  properties:
    description: Timestamp the row was loaded into the canonical layer.
  is_primary_key: false
properties:
  description: One row per vendor, with terms and lead-time attributes from the purchasing master.
primary_key: vendor_key
