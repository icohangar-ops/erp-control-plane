name: fact_gl_transaction
table_reference:
  catalog: analytics
  schema: main_canonical
  table: fact_gl_transaction
columns:
- name: gl_line_key
  type: VARCHAR
  not_null: true
  properties:
    description: Surrogate GL line key (source document + line).
  is_primary_key: true
- name: source_system
  type: VARCHAR
  properties:
    description: Originating source ERP for this row; acquisitions keep their system of record until re-platformed.
  is_primary_key: false
- name: source_doc_no
  type: VARCHAR
  properties:
    description: Native document number in the source ERP (invoice, order, PO, or journal).
  is_primary_key: false
- name: source_line_no
  type: BIGINT
  properties:
    description: Native line number within the source document.
  is_primary_key: false
- name: location_key
  type: VARCHAR
  properties:
    description: Foreign key to dim_location.
  is_primary_key: false
- name: entry_date
  type: DATE
  properties:
    description: Accounting entry date.
  is_primary_key: false
- name: source_gl_account
  type: VARCHAR
  properties:
    description: Chart-of-accounts number in the source ERP before consolidation.
  is_primary_key: false
- name: consolidated_account
  type: VARCHAR
  not_null: true
  properties:
    description: Consolidated account name after crosswalk mapping (e.g. AR, AP, COGS).
  is_primary_key: false
- name: mapping_rule_type
  type: VARCHAR
  properties:
    description: 'How the account was mapped: exact, alias, or manual override.'
  is_primary_key: false
- name: description
  type: VARCHAR
  properties:
    description: Item description as sold in the branch system.
  is_primary_key: false
- name: debit_amt
  type: DECIMAL(38,9)
  properties:
    description: Debit amount in USD.
  is_primary_key: false
- name: credit_amt
  type: DECIMAL(38,9)
  properties:
    description: Credit amount in USD.
  is_primary_key: false
- name: net_amount
  type: DECIMAL(38,9)
  properties:
    description: Net signed amount (debit minus credit) in USD.
  is_primary_key: false
- name: source_file
  type: VARCHAR
  properties:
    description: Source file this row was extracted from (lineage).
  is_primary_key: false
- name: source_row_no
  type: BIGINT
  properties:
    description: Row number within the source file (lineage).
  is_primary_key: false
- name: batch_id
  type: VARCHAR
  properties:
    description: Identifier of the dlt ingestion batch that loaded this row.
  is_primary_key: false
- name: loaded_at
  type: VARCHAR
  properties:
    description: Timestamp the row was loaded into the canonical layer.
  is_primary_key: false
properties:
  description: GL lines with consolidated account resolved via COA mapping.
primary_key: gl_line_key
