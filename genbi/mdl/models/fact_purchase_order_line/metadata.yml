name: fact_purchase_order_line
table_reference:
  catalog: analytics
  schema: main_canonical
  table: fact_purchase_order_line
columns:
- name: po_line_key
  type: VARCHAR
  not_null: true
  properties:
    description: Surrogate PO-line key (source document + line).
  is_primary_key: true
- name: po_key
  type: VARCHAR
  properties:
    description: Source purchase-order identifier.
  is_primary_key: false
- name: source_system
  type: VARCHAR
  properties:
    description: Originating source ERP for this row; acquisitions keep their system of record until re-platformed.
  is_primary_key: false
- name: source_doc_no
  type: VARCHAR
  properties:
    description: Native document number in the source ERP (invoice, order, PO, or journal).
  is_primary_key: false
- name: source_line_no
  type: BIGINT
  properties:
    description: Native line number within the source document.
  is_primary_key: false
- name: vendor_key
  type: VARCHAR
  properties:
    description: Foreign key to dim_vendor.
  is_primary_key: false
- name: item_key
  type: VARCHAR
  properties:
    description: Foreign key to dim_item.
  is_primary_key: false
- name: location_key
  type: VARCHAR
  properties:
    description: Foreign key to dim_location.
  is_primary_key: false
- name: po_date
  type: DATE
  properties:
    description: Purchase-order date.
  is_primary_key: false
- name: received_date
  type: DATE
  properties:
    description: Date the line was received (null until received).
  is_primary_key: false
- name: uom
  type: VARCHAR
  properties:
    description: Selling unit of measure.
  is_primary_key: false
- name: ordered_qty
  type: BIGINT
  properties:
    description: Quantity ordered.
  is_primary_key: false
- name: received_qty
  type: BIGINT
  properties:
    description: Quantity received to date.
  is_primary_key: false
- name: unit_cost_actual
  type: DECIMAL(38,9)
  properties:
    description: Actual received unit cost in USD.
  is_primary_key: false
- name: unit_cost_standard
  type: DECIMAL(38,9)
  properties:
    description: Standard cost at receipt in USD.
  is_primary_key: false
- name: purchase_price_variance
  type: DECIMAL(38,9)
  properties:
    description: Purchase price variance in USD ((actual - standard) x received qty).
  is_primary_key: false
- name: is_received_in_full
  type: BOOLEAN
  properties:
    description: True when the line was fully received.
  is_primary_key: false
- name: is_received
  type: BOOLEAN
  properties:
    description: True when any quantity was received.
  is_primary_key: false
- name: source_file
  type: VARCHAR
  properties:
    description: Source file this row was extracted from (lineage).
  is_primary_key: false
- name: source_row_no
  type: BIGINT
  properties:
    description: Row number within the source file (lineage).
  is_primary_key: false
- name: batch_id
  type: VARCHAR
  properties:
    description: Identifier of the dlt ingestion batch that loaded this row.
  is_primary_key: false
- name: loaded_at
  type: VARCHAR
  properties:
    description: Timestamp the row was loaded into the canonical layer.
  is_primary_key: false
properties:
  description: One row per purchase-order line with receipt and price-variance measures.
primary_key: po_line_key
