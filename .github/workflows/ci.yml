name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: pytest -q

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . dbt-duckdb
      - name: Extract seeded dealer to Parquet
        run: python -m connectors.cli extract --source csvsftp_ridgeline --entity invoice_lines
      - run: python -m connectors.cli extract --source csvsftp_ridgeline  # remaining entities
      - name: dbt build (all models + tests, DuckDB)
        run: dbt build --project-dir dbt --profiles-dir dbt --target demo

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose --profile bi config -q
